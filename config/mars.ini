[base]
# TODO: Sweep params
env_name = mars

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 4
action_mask_size = 10

[env]
num_agents = 16
size = 5
base_seed = 0
num_layouts = 256
shielding = 0
reward_task = 1.0
reward_new_cell = 0.2
reward_lost = 0.0

[policy]
hidden_size = 128
num_layers = 2

[train]
total_timesteps = 50_000_000

[sweep.env.reward_task]
distribution = uniform
min = 0.2
max = 3.0
scale = auto

[sweep.env.reward_new_cell]
distribution = uniform
min = -0.1
max = 0.3
scale = auto

[sweep.env.reward_lost]
distribution = uniform
min = -0.5
max = 0.1
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0001
max = 0.05
mean = 0.001
scale = auto
