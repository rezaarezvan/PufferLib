[base]
# TODO: Sweep params
env_name = advertising

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 4
action_mask_size = 7

[env]
num_agents = 16
horizon = 15
shielding = 0
reward_purchase = 1.0
reward_progress = 0.0
reward_lost = 0.0

[policy]
hidden_size = 128
num_layers = 2

[train]
total_timesteps = 50_000_000
ent_coef = 0.05
anneal_ent_coef = 0

[sweep.env.reward_purchase]
distribution = uniform
min = 0.5
max = 5.0
scale = auto

[sweep.env.reward_progress]
distribution = uniform
min = -0.2
max = 0.2
scale = auto

[sweep.env.reward_lost]
distribution = uniform
min = -0.3
max = 0.1
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.005
max = 0.5
mean = 0.05
scale = auto
